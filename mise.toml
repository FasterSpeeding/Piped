[tools]
# Languages
node = "24"
python = "3"
# CLI tools
# Black has to be installed from PyPi to support their ARM fallback to pure-python.
"pipx:black" = "25.12.0"
"pipx:codespell" = "2.4.3"
"pipx:isort" = "8.0.1"
"pipx:mypy" = "2.3.1"
"pipx:pre-commit-hooks" = "6.0.0"
"pipx:pycln" = "2.6.0"
"npm:pyright" = "1.1.413"
"npm:renovate" = { version = "44.52.0", trust_policy_excludes = ["@yarnpkg/libzip"] }
ruff = "0.14.10"
"pipx:sort-all" = "1.3.0"
uv = "0.12.7"
just = "1.49.0"

[settings]
activate_aggressive = true
experimental = true
gpg_verify = true
lockfile = true
not_found_auto_install = false
paranoid = true
plugin_autoupdate_last_check_duration = "0"
go_skip_checksum = true

[settings.python]
compile = false
uv_venv_auto = false
